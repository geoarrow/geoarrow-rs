language = "C"
cpp_compat = true
header = "// Auto-generated by cbindgen - DO NOT EDIT\n// geoarrow-rs C API"
include_guard = "GEOARROW_RS_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
# Status codes are errno values, so callers need <errno.h> to name them.
sys_includes = ["errno.h"]
# The Arrow C Data Interface structs are emitted by hand, wrapped in the
# interface's canonical ARROW_C_DATA_INTERFACE guard, so this header can be
# included in one translation unit with arrow/c/abi.h, nanoarrow.h or
# geoarrow.h. cbindgen's own copies are excluded below.
after_includes = """
#ifndef ARROW_C_DATA_INTERFACE
#define ARROW_C_DATA_INTERFACE

#define ARROW_FLAG_DICTIONARY_ORDERED 1
#define ARROW_FLAG_NULLABLE 2
#define ARROW_FLAG_MAP_KEYS_SORTED 4

struct ArrowSchema {
  const char* format;
  const char* name;
  const char* metadata;
  int64_t flags;
  int64_t n_children;
  struct ArrowSchema** children;
  struct ArrowSchema* dictionary;
  void (*release)(struct ArrowSchema*);
  void* private_data;
};

struct ArrowArray {
  int64_t length;
  int64_t null_count;
  int64_t offset;
  int64_t n_buffers;
  int64_t n_children;
  const void** buffers;
  struct ArrowArray** children;
  struct ArrowArray* dictionary;
  void (*release)(struct ArrowArray*);
  void* private_data;
};

#endif  // ARROW_C_DATA_INTERFACE

typedef struct ArrowSchema ArrowSchema;
typedef struct ArrowArray ArrowArray;
"""

[export]
# No prefix rule: functions are already named GeoArrowRs* in the Rust source,
# the shared vocabulary types deliberately keep geoarrow-c's exact spelling, and
# the Arrow C Data Interface struct names must stay canonical so consumers can
# interop with any library that speaks it.
item_types = ["globals", "enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]
# Nothing in a signature refers to these: the enums exist to name the integer
# codes that the functions validate, so cbindgen has to be told to emit them.
include = ["GeoArrowDimensions", "GeoArrowCoordType", "GeoArrowEdgeType", "GeoArrowType"]
# Emitted by hand in after_includes, inside the canonical guard.
exclude = ["ArrowArray", "ArrowSchema"]

[parse]
parse_deps = false

# The compute entry points are macro-generated, so cbindgen must expand macros
# to see them. Expansion compiles the crate through rustc, which needs a
# nightly toolchain; see the header section of README.md.
[parse.expand]
crates = ["geoarrow-c-api"]

[fn]
args = "horizontal"

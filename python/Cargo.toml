[workspace]
members = ["geoarrow-compute", "geoarrow-core", "geoarrow-io"]
resolver = "2"

[workspace.package]
authors = ["Kyle Barron <kylebarron2@gmail.com>"]
version = "0.6.3"
edition = "2024"
homepage = "https://geoarrow.org/geoarrow-rs/"
repository = "https://github.com/geoarrow/geoarrow-rs"
license = "MIT OR Apache-2.0"
keywords = ["python", "arrow", "geospatial"]
categories = ["wasm", "science::geo"]
rust-version = "1.95"

[workspace.dependencies]
arrow = "59"
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
flatgeobuf = { version = "5.0", default-features = false }
geo-traits = "0.3"
geoarrow-array = { git = "https://github.com/geoarrow/geoarrow-rs", rev = "02985efd113aa5d5678a9eecbed1551a00bbc7f4" }
geoarrow-cast = { git = "https://github.com/geoarrow/geoarrow-rs", rev = "02985efd113aa5d5678a9eecbed1551a00bbc7f4" }
geoarrow-flatgeobuf = { git = "https://github.com/geoarrow/geoarrow-rs", rev = "02985efd113aa5d5678a9eecbed1551a00bbc7f4" }
geoarrow-schema = { git = "https://github.com/geoarrow/geoarrow-rs", rev = "02985efd113aa5d5678a9eecbed1551a00bbc7f4" }
geoparquet = { git = "https://github.com/geoarrow/geoarrow-rs", rev = "02985efd113aa5d5678a9eecbed1551a00bbc7f4" }
geozero = "0.14"
http-range-client = { version = "0.9.0", default-features = false }
indexmap = "2.5.0"
numpy = "0.29"
object_store = "0.13"
parquet = "59"
pyo3 = { version = "0.29", features = ["hashbrown", "serde", "anyhow"] }
pyo3-arrow = "0.19"
pyo3-geoarrow = { git = "https://github.com/geoarrow/geoarrow-rs", rev = "02985efd113aa5d5678a9eecbed1551a00bbc7f4" }
serde_json = "1"
thiserror = "1"

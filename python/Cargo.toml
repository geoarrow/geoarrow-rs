[workspace]
members = ["geoarrow-compute", "geoarrow-core", "geoarrow-io"]
resolver = "2"

[workspace.package]
authors = ["Kyle Barron <kylebarron2@gmail.com>"]
version = "0.6.3"
edition = "2024"
homepage = "https://geoarrow.org/geoarrow-rs/"
repository = "https://github.com/geoarrow/geoarrow-rs"
license = "MIT OR Apache-2.0"
keywords = ["python", "arrow", "geospatial"]
categories = ["wasm", "science::geo"]
rust-version = "1.95"

[workspace.dependencies]
arrow = "59"
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
flatgeobuf = { version = "5.0", default-features = false }
geo-traits = "0.3"
geoarrow-array = { path = "../rust/geoarrow-array" }
geoarrow-cast = { path = "../rust/geoarrow-cast" }
geoarrow-flatgeobuf = { path = "../rust/geoarrow-flatgeobuf" }
geoarrow-schema = { path = "../rust/geoarrow-schema" }
geoparquet = { path = "../rust/geoparquet" }
geozero = "0.14"
http-range-client = { version = "0.9.0", default-features = false }
indexmap = "2.5.0"
numpy = "0.29"
object_store = "0.13"
parquet = "59"
pyo3 = { version = "0.29", features = ["hashbrown", "serde", "anyhow"] }
pyo3-arrow = "0.19"
pyo3-geoarrow = { path = "../rust/pyo3-geoarrow" }
serde_json = "1"
thiserror = "1"

# Pinned for georust/geo#1538 (XYZM index APIs, unreleased); drop on geo 0.34.
# Duplicated from the root pin because python/ is a separate cargo workspace.
[patch.crates-io]
geo = { git = "https://github.com/georust/geo", rev = "7b9c8417eec4b8a5763ca487fcb51c7d7cb1b177" }

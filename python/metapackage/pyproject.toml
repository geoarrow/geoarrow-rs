[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoarrow-rust"
version = "0.1.0"
description = 'Metapackage for geoarrow.rust namespace.'
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = []
authors = [{ name = "Kyle Barron", email = "kylebarron2@gmail.com" }]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["geoarrow-rust-core"]

[project.urls]
Documentation = "https://geoarrow.org"
Issues = "https://github.com/geoarrow/geoarrow-rs/issues"
Source = "https://github.com/geoarrow/geoarrow-rs"

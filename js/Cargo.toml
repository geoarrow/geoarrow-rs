[package]
name = "geoarrow-wasm"
version = "0.2.0-beta.5"
authors = ["Kyle Barron <kylebarron2@gmail.com>"]
edition = "2024"
description = "Efficient, vectorized geospatial operations in WebAssembly."
readme = "README.md"
repository = "https://github.com/geoarrow/geoarrow-rs"
license = "MIT OR Apache-2.0"
keywords = ["webassembly", "arrow", "geospatial"]
categories = ["wasm", "science::geo"]
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# It appears that adding console_error_panic_hook only adds 4kb of size (before gzipping) so for now
# to make debugging easier we'll include it as a default feature
default = ["console_error_panic_hook"]

# Include algorithm bindings backed by geoarrow-expr-geo (area, centroid, simplify, ...)
algorithm = ["data", "dep:geoarrow-expr-geo"]

# Include Data classes for contiguous GeoArrow memory (PointData, etc)
data = []

geodesy = ["dep:geodesy"]
debug = ["console_error_panic_hook"]
# io_flatgeobuf = ["geoarrow/flatgeobuf", "table"]
io_geojson = ["table"]
io_http = []
io_object_store = [
    "dep:async-trait",
    "dep:futures",
    "dep:object_store",
    "dep:reqwest",
    "dep:tokio",
    "dep:url",
    "parquet/object_store",
]
io_parquet = ["dep:geoparquet", "table", "data", "dep:bytes", "dep:parquet"]
io_parquet_async = [
    "async-stream",
    "dep:indexmap",
    "geoparquet/async",
    "io_http",
    "io_object_store",
    "io_parquet",
    "parquet/async",
    "range-reader",
    "wasm-streams",
]
io_parquet_compressions = [
    "io_parquet",
    "io_parquet_brotli",
    "io_parquet_gzip",
    "io_parquet_snappy",
    "io_parquet_zstd",
    "io_parquet_lz4",
]
io_parquet_brotli = ["io_parquet", "parquet/brotli"]
io_parquet_gzip = ["io_parquet", "parquet/flate2"]
io_parquet_snappy = ["io_parquet", "parquet/snap"]
io_parquet_zstd = ["io_parquet", "parquet/zstd", "dep:zstd", "dep:zstd-sys"]
io_parquet_lz4 = ["io_parquet", "parquet/lz4"]

# Include scalar classes
scalar = []

# Include GeoTable class
table = []

# Include vector classes for chunked GeoArrow memory (PointVector, etc)
vector = []

[dependencies]
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.44"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
arrow-array = "59"
arrow-buffer = "59"
arrow-select = "59"
arrow-wasm = { git = "https://github.com/kylebarron/arrow-wasm", rev = "ee163ba9cfa1c5d078e7625ac8bcd3cd1e6bda8e" }
async-stream = { version = "0.3.5", optional = true }
async-trait = { version = "0.1.77", optional = true }
bytes = { version = "1", optional = true }
console_error_panic_hook = { version = "0.1.6", optional = true }
futures = { version = "0.3.30", optional = true }
geo = "0.33"
geo-traits = "0.3"
geoarrow-array = { path = "../rust/geoarrow-array" }
geoarrow-cast = { path = "../rust/geoarrow-cast" }
geoarrow-expr-geo = { path = "../rust/geoarrow-expr-geo", optional = true }
geoarrow-schema = { path = "../rust/geoarrow-schema" }
geodesy = { version = "0.12", optional = true, features = ["js"] }
geoparquet = { path = "../rust/geoparquet", optional = true }
indexmap = { version = "2", optional = true }
object_store = { version = "0.13", optional = true, features = ["http"] }
# object-store-wasm is left out on purpose: the HTTP store of object_store runs
# under wasm already, and the 0.12 pin of the shim would clash with the 0.13 here.
parquet = { version = "59", optional = true, features = ["arrow", "base64"] }
range-reader = { version = "0.2", optional = true }
reqwest = { version = "*", optional = true }
thiserror = "1"
tokio = { version = "*", default-features = false, optional = true }
wasm-streams = { version = "0.4.0", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

url = { version = "2.5.0", optional = true }

# Pass "wasm" and "thin" down to the transitive zstd dependency
zstd = { version = "*", features = [
    "wasm",
    "thin",
], default-features = false, optional = true }

# TODO: temporary to fix parquet wasm build
# upstream issue: https://github.com/gyscos/zstd-rs/issues/269
zstd-sys = { version = "=2.0.9", optional = true, default-features = false }


[dependencies.web-sys]
version = "0.3.4"
features = ['console']

# object_store's http feature pulls rand 0.10 -> getrandom 0.4, whose wasm32
# backend is only compiled in when its wasm_js feature is enabled.
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom_v04]
package = "getrandom"
version = "0.4"
features = ["wasm_js"]

[dev-dependencies]
wasm-bindgen-test = "0.3.13"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
] }

# Pinned to include https://github.com/georust/geo/pull/1538; drop on geo 0.34. Repeats ../Cargo.toml's patch (js/ is outside the workspace).
[patch.crates-io]
geo = { git = "https://github.com/georust/geo", rev = "7b9c8417eec4b8a5763ca487fcb51c7d7cb1b177" }
